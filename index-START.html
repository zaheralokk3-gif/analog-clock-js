<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS + CSS Clock</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>


    <div class="clock">
      <div class="clock-face">
        <div class="hand hour-hand"></div>
        <div class="hand min-hand"></div>
        <div class="hand second-hand"></div>
      </div>
    </div>


  <style>
    html {
      background: #018DED url(https://unsplash.it/1500/1000?image=881&blur=5);
      background-size: cover;
      font-family: 'helvetica neue';
      text-align: center;
      font-size: 10px;
    }

    body {
      margin: 0;
      font-size: 2rem;
      display: flex;
      flex: 1;
      min-height: 100vh;
      align-items: center;
    }

    .clock {
      width: 30rem;
      height: 30rem;
      border: 20px solid white;
      border-radius: 50%;
      margin: 50px auto;
      position: relative;
      padding: 2rem;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.1),
        inset 0 0 0 3px #EFEFEF,
        inset 0 0 10px black,
        0 0 10px rgba(0,0,0,0.2);
    }

    .clock-face {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateY(-0px); /* account for the height of the clock hands */
    }
    .clock-face::after {
      content: '';
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background-color: #EFEFEF;
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 999;
      transform: translate(-50%, -50%);
    }

    .hand {
      width: 50%;
      height: 6px;
      background: black;
      position: absolute;
      border-radius: 50px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      left: 45%;
      transform-origin: 15px;
      transition-timing-function: cubic-bezier(0.45, 0.05, 0, 2.06);
      transition: all 0.05s;
    }
    .hour-hand {
      width: 40%;
      height: 9px;
    }
    .second-hand {
      height: 3px;
    }

  </style>
    

  <script>
    let hoursHand = document.querySelector(".hour-hand");
    let minutsHand = document.querySelector(".min-hand");
    let secondsHand = document.querySelector(".second-hand");

    function setDate () {
      const now = new Date();
      
      // seconds
      const seconds = now.getSeconds();
      const secondDeg = seconds * 6;
      secondsHand.style.transform = `rotate(${secondDeg - 90 }deg)`;

      //min

      const minuts = now.getMinutes();
      const minutDeg = minuts * 6;
      minutsHand.style.transform = `rotate(${minutDeg - 90 }deg)`;

      //

      const hours = now.getHours();
      const hourDeg = hours * 6;
      hoursHand.style.transform = `rotate(${hourDeg - 90 }deg)`;
    }
    setInterval(setDate, 1000);

  setDate()
  </script>
</body>
</html>
